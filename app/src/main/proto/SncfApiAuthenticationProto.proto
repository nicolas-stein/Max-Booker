syntax = "proto3";

option java_package = "fr.stein.maxbooker.data.local.sncfapiauthentication";
option java_multiple_files = true;

message SncfApiAuthenticationProto {
  SncfApiTokenProto sncf_api_token = 1;
  string cookies = 2;
}

message SncfApiTokenProto {
  string id_token = 1;
  int32 expires_in = 2;
  string refresh_token = 3;
  string token_type = 4;
}