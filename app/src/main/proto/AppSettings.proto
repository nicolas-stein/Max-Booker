syntax = "proto3";

option java_package = "fr.stein.maxbooker.proto";
option java_multiple_files = true;

message AppSettings {
  MyReservationsSettings myReservationsSettings = 1;
}

message MyReservationsSettings {
  bool showPastReservations = 1;
  int64 pastReservationsDuration = 2;
  bool autoConfirmReservations = 3;
}