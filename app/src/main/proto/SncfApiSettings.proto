syntax = "proto3";

option java_package = "fr.stein.maxbooker.proto";
option java_multiple_files = true;

message SncfApiSettings {
  string cookies = 1;
  string refresh_token = 2;
  string auth_token = 3;
}

message SncfUser {
  string first_name = 1;
  string last_name = 2;
  repeated SncfCard cards = 3;
}

message SncfCard {
  string card_number = 1;
  string product_type = 2;
}